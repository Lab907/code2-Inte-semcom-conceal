experiment:
  name: snr20_minimal_loop
  output_dir: outputs/snr20

seed: 42

device:
  prefer_cuda: true

signal:
  snr_db: 20
  sample_rate: 1000000
  num_symbols: 1024
  modulation: 16qam

data:
  batch_size: 32
  num_workers: 0
  max_time_index: 100

impairments:
  num_tx: 6
  gain_db_std: 1.0
  gain_drift_db_per_step: 0.0
  phase_rad_std: 0.2
  phase_drift_rad_per_step: 0.0
  cfo_hz_std: 100.0
  cfo_drift_hz_per_step: 0.0
  iq_gain_mismatch_db_std: 0.5
  iq_phase_mismatch_rad_std: 0.05
  dc_offset_std: 0.02

teacher:
  epochs: 30
  batch_size: 128
  lr: 0.001
  num_steps_per_epoch: 100
  hidden_channels: 48
  num_blocks: 3
  condition_dim: 16
  max_residual_power_ratio: 0.1
  lambda_align: 1.0
  lambda_mean: 1.0
  lambda_cov: 1.0
  lambda_mmd: 1.0
  lambda_evm: 5.0
  lambda_softbit: 2.0
  lambda_power: 10.0
  mmd_sigmas: [0.5, 1.0, 2.0, 4.0, 8.0]

compensation_dataset:
  batch_size: 64
  train_batches: 8
  val_batches: 2
  test_batches: 2
  checkpoint: outputs/snr20/checkpoints/teacher_best.pt

fixed_precomp:
  max_residual_power_ratio: 0.1
  checkpoint: outputs/snr20/checkpoints/teacher_best.pt

eval_signal_collection:
  batch_size: 32
  num_batches: 6
  checkpoint: outputs/snr20/checkpoints/teacher_best.pt

eve:
  epochs: 30
  batch_size: 64
  lr: 0.001
  train_ratio: 0.6
  val_ratio: 0.2
  num_classes: 6
  max_batches: null
